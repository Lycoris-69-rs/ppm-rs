[package]
name = "ppm"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "PPM - Powerful Package Manager: a ratatui TUI front-end for pacman and AUR"
license = "MIT"

[[bin]]
name = "ppm"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[dependencies]
anyhow = "1.0.105"
crossterm = "0.29.0"
flate2 = "1.1.11"
futures = "0.3.34"
ratatui = "0.30"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "gzip", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util"] }
tokio-util = { version = "0.7.20", features = ["rt"] }

[lib]
name = "ppm"
path = "src/lib.rs"
